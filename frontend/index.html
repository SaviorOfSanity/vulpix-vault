<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Vulpix Vault — Master Set & Auction Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand-home" title="Go to Master Set Binder">
        <span class="brand-emblem" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
            <rect width="32" height="32" rx="9" fill="url(#foxGrad)"/>
            <path d="M8 10L12.5 14.5L16 13.2L19.5 14.5L24 10L23 19.5L16 24.5L9 19.5L8 10Z" fill="#0b0f19" fill-opacity="0.9"/>
            <path d="M13 17.5L14.5 18.8M19 17.5L17.5 18.8" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="16" cy="21" r="1.2" fill="#fbbf24"/>
            <defs>
              <linearGradient id="foxGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#f59e0b"/>
                <stop offset="1" stop-color="#ea580c"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <div>
          <div class="brand-title">The Vulpix Vault</div>
          <div class="brand-sub">Master Set &amp; Auction Command</div>
        </div>
      </div>

      <div class="global-search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L17.5 17.5" stroke-linecap="round"/>
        </svg>
        <input
          id="global-search"
          type="search"
          placeholder="Quick auction lookup: set, #, language, error (e.g. 'gym challenge 37', 'hp 50', '151')..."
          autocomplete="off"
        />
        <kbd class="kbd-hint">/</kbd>
      </div>

      <nav class="nav-tabs" aria-label="Main navigation">
        <button class="nav-tab active" data-tab="binder">
          <span>Master Set</span>
          <span class="nav-pill" id="nav-owned-pill">—</span>
        </button>
        <button class="nav-tab" data-tab="vault">
          <span>My Vault</span>
          <span class="nav-pill" id="nav-vault-pill">—</span>
        </button>
        <button class="nav-tab" data-tab="radar">
          <span>Auction Radar</span>
          <span class="nav-pill" id="nav-radar-pill">0</span>
        </button>
        <button class="nav-tab" data-tab="sync">
          <span>Sync &amp; Pricing</span>
        </button>
      </nav>
    </div>
  </header>

  <div id="sync-banner" class="sync-banner hidden"></div>

  <main class="main-shell">
    <section id="view-binder" class="view-section active"></section>
    <section id="view-vault" class="view-section"></section>
    <section id="view-radar" class="view-section"></section>
    <section id="view-sync" class="view-section"></section>
  </main>

  <!-- Card Inspection / Auction Command Center Modal -->
  <div id="card-modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="card-modal" class="modal-dialog modal-xl"></div>
  </div>

  <!-- Vault Add / Edit Modal -->
  <div id="vault-modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="vault-modal" class="modal-dialog modal-md"></div>
  </div>

  <!-- Toast stack -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>

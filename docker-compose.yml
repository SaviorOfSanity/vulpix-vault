services:
  vulpix-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulpix-vault
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/data/vulpix_vault.db
    volumes:
      - ./data:/data
